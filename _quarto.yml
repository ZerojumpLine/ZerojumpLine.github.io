project:
  type: website
  output-dir: _site
  post-render:
    - tools/cache-bust.ts   # fingerprint our CSS/JS URLs so deploys never mix new HTML with cached old CSS
  resources:
    - assets/js/
    - assets/fonts/
    - assets/zerojump/img/wechat-qr.png
    - assets/zerojump/img/signature.png

website:
  title: "Zeju Li – Fudan"
  site-url: https://zerojumpline.github.io/
  description: "Zeju Li, Associate Professor at Fudan University — machine learning for medical image analysis and neuroimaging."
  image: assets/zerojump/img/social-card.jpg   # default link-preview image (pages with their own image override it)
  open-graph: true
  favicon: assets/zerojump/img/brain_logo_ink.png
  page-navigation: true
  back-to-top-navigation: true

  twitter-card:
    creator: "@ZerojumpLine"
    site: "@ZerojumpLine"
    card-style: summary_large_image
  # comments (utterances) are enabled only in news/, blog/ and publication/ (_metadata.yml)
  navbar:
    title: "Zeju Li"
    logo: assets/zerojump/img/brain_logo_ink.png
    toggle-color-scheme: true
    tools:
    - icon: github
      href: https://github.com/ZerojumpLine/ZerojumpLine.github.io
    right:
      - text: About
        menu:
          - text: About Me
            aria-label: "About Me"
            href: about/index.qmd
          - text: Find Me
            aria-label: "Contact & Location"
            href: about/find-me.qmd
      - text: News
        aria-label: "Latest News"
        href: news/index.qmd
      - text: Blog
        aria-label: "Blogs"
        href: blog/index.qmd
      - text: Team
        aria-label: "Our Team"
        href: team/index.qmd
      - text: Publications
        aria-label: "Publications"
        href: publication/index.qmd
      - text: Teaching
        aria-label: "Teaching Materials"
        href: teaching/index.qmd
  
  page-footer:
    left: >-
      &#169; 2025&ndash; Zeju Li &#8729; Made with [Quarto](https://quarto.org)
    center: >-
      Fudan University, Shanghai, China
    right: >-
      <a class="zl-footer-icon" href="https://www.linkedin.com/in/zeju-li-a42676102/" title="LinkedIn" target="_blank" rel="noopener">{{< fa brands linkedin >}}</a>
      <a class="zl-footer-icon" href="https://twitter.com/li_zeju" title="X" target="_blank" rel="noopener">{{< fa brands x-twitter >}}</a>
      <span class="zl-wechat" tabindex="0" title="微信公众号 · 江湾智影"><span class="zl-footer-icon">{{< fa brands weixin >}}</span><span class="zl-wechat__card"><img src="/assets/zerojump/img/wechat-qr.png" alt="WeChat official account 江湾智影 QR code"><span>微信公众号 · 江湾智影</span></span></span>

format:
  html:
    # Colours: assets/theme/light.scss + dark.scss (palette only).
    # Everything else is shared, so toggling the scheme never moves the layout.
    theme:
      light: [cosmo, assets/theme/base.scss, assets/theme/light.scss]
      dark:  [cosmo, assets/theme/base.scss, assets/theme/dark.scss]
    css:
      - assets/css/fonts.css      # self-hosted @font-face (no Google Fonts)
      - assets/css/base.css       # typography, navbar, footer, buttons, page headers
      - assets/css/listings.css   # News / Blog / Publications lists, Team / Teaching grids
      - assets/css/article.css    # posts, publications, citation blocks
      - assets/css/pages.css      # About & member profiles, Find Me, Vacancies, Alumni
      - assets/css/home.css       # homepage hero and sections
    highlight-style: a11y
    code-link: true
    lightbox: true

execute: 
  freeze: auto
  python: /opt/anaconda3/bin/python

jupyter: python3

include-in-header:
  - text: |
      <!-- Umami analytics (cookie-free): https://cloud.umami.is -->
      <script defer src="https://cloud.umami.is/script.js" data-website-id="13c8f25a-1f21-4fce-8a7b-08810724c218"></script>
      <script src="/assets/js/citation-copy.js"></script>
      <script src="/assets/js/category-links.js"></script>
      <script src="/assets/js/comments-theme.js"></script>
